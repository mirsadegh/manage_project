services:
  web:
    build:
      context: .
      target: dev
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override .env DATABASE_URL (hard-coded localhost) so settings.py
      # falls through to DATABASE_HOST/REDIS_HOST = compose service names.
      - DATABASE_URL=
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../project-management-frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ../project-management-frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: dev
    command: celery -A config worker -l info
    volumes:
      - ./:/app
    env_file: .env
    environment:
      # Same overrides as web: container-network hostnames, not localhost.
      - DATABASE_URL=
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      target: dev
    command: celery -A config beat -l info
    volumes:
      - ./:/app
    env_file: .env
    environment:
      # Same overrides as web: container-network hostnames, not localhost.
      - DATABASE_URL=
      - DATABASE_HOST=db
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  clamav:
    image: clamav/clamav:latest
